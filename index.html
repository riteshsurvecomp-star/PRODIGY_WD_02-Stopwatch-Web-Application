<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prodigy Stopwatch</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="container">
        <header>
            <h1 class="app-title">PRODIGY <span>STOPWATCH</span></h1>
        </header>

        <div class="stopwatch-card">
            <div class="timer-display">
                <span id="minutes">00</span><span class="colon">:</span><span id="seconds">00</span><span
                    class="colon">.</span><span id="milliseconds">00</span>
            </div>

            <div class="controls">
                <button id="startStopBtn" class="btn btn-primary">
                    <i class="fas fa-play"></i> Start
                </button>
                <button id="lapBtn" class="btn btn-secondary" disabled>
                    <i class="fas fa-flag"></i> Lap
                </button>
                <button id="resetBtn" class="btn btn-danger" disabled>
                    <i class="fas fa-undo"></i> Reset
                </button>
            </div>
        </div>

        <div class="laps-container">
            <div class="laps-header">
                <span>Lap #</span>
                <span>Time</span>
            </div>
            <ul id="lapsList" class="laps-list">
                <!-- Laps will be added here dynamically -->
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
